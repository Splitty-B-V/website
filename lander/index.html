<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitty - Verhoog je omzet met 50%</title>
    <meta name="description" content="Laat je klanten betalen zoals zij willen. Verhoog conversie met flexibele betaalopties.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0E100F 0%, #1a1c1b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: 100px; /* Space for logo on mobile */
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            color: white;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }
        
        .accent {
            background: linear-gradient(135deg, #43DB6F 0%, #00FF66 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .description {
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(1rem, 3vw, 1.25rem);
            line-height: 1.6;
            margin-bottom: 3rem;
            padding: 0 20px;
        }
        
        .form {
            max-width: 400px;
            margin: 0 auto 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0 20px;
        }
        
        .input {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px; /* Prevents zoom on iOS */
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
        }
        
        .input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .input:focus {
            outline: none;
            border-color: #43DB6F;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(67, 219, 111, 0.1);
        }
        
        .button {
            padding: 1.25rem 2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #43DB6F 0%, #00FF66 100%);
            color: #0E100F;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(67, 219, 111, 0.3);
            width: 100%;
            -webkit-appearance: none;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(67, 219, 111, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .features {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            padding: 0 20px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 120px;
            z-index: 10;
        }
        
        .success-message {
            display: none;
            color: #43DB6F;
            padding: 1.5rem;
            background: rgba(67, 219, 111, 0.1);
            border-radius: 12px;
            margin: 2rem 20px;
            font-size: 1.125rem;
            border: 2px solid rgba(67, 219, 111, 0.3);
        }
        
        .success-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Mobile styles */
        @media (max-width: 768px) {
            body {
                padding: 20px;
                padding-top: 120px; /* More space for logo on mobile */
                min-height: 100vh;
                display: flex;
                align-items: flex-start;
                padding-bottom: 40px;
            }
            
            .container {
                margin-top: 0;
            }
            
            h1 {
                font-size: 2rem;
                margin-bottom: 1rem;
            }
            
            .description {
                font-size: 1rem;
                margin-bottom: 2rem;
                padding: 0;
            }
            
            .features {
                flex-direction: column;
                gap: 0.75rem;
                align-items: center;
            }
            
            .logo {
                width: 100px;
                top: 20px;
                left: 20px;
                position: absolute; /* Changed from fixed to absolute on mobile */
            }
            
            .form {
                padding: 0;
            }
            
            .input {
                font-size: 16px; /* Prevents zoom on iOS */
                padding: 0.875rem 1rem;
            }
            
            .button {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
        }
        
        /* Very small devices */
        @media (max-width: 375px) {
            body {
                padding: 15px;
                padding-top: 100px;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .description {
                font-size: 0.95rem;
            }
            
            .logo {
                width: 80px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <img src="https://cdn.prod.website-files.com/680a69113e179ecd02a69613/680be744050df4a2fa729a9d_Logo.svg" 
         alt="Splitty Logo" 
         class="logo">
    
    <div class="container">
        <h1>Verhoog je omzet met <span class="accent">50%</span></h1>
        <p class="description">
            Bied je klanten de vrijheid om te betalen zoals zij willen. 
            Split betalingen, betaal later, of direct - alles in één oplossing.
        </p>
        
        <form class="form" id="lead-form" action="https://formspree.io/f/mjkrvran" method="POST">
            <input type="text" name="name" placeholder="Naam" class="input" required>
            <input type="email" name="email" placeholder="Email" class="input" required>
            <input type="tel" name="phone" placeholder="Telefoonnummer" class="input" required>
            <input type="text" name="company" placeholder="Bedrijfsnaam (optioneel)" class="input">
            <input type="hidden" name="_subject" value="Nieuwe lead van landing page">
            <button type="submit" class="button">Start Gratis Trial</button>
        </form>
        
        <div class="success-message" id="success-message">
            ✓ Bedankt! We nemen snel contact met je op.
        </div>
        
        <div class="features">
            <div class="feature">✓ Geen setupkosten</div>
            <div class="feature">✓ Binnen 5 minuten live</div>
            <div class="feature">✓ 30 dagen gratis proberen</div>
        </div>
    </div>
    
    <script>
        // Form submission handler
        const form = document.getElementById('lead-form');
        const successMessage = document.getElementById('success-message');
        
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const button = form.querySelector('.button');
                const originalText = button.textContent;
                button.textContent = 'Verzenden...';
                button.disabled = true;
                
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        form.style.display = 'none';
                        successMessage.classList.add('show');
                        
                        // Track conversion if gtag is available
                        if (typeof gtag !== 'undefined') {
                            gtag('event', 'conversion', {
                                'send_to': 'AW-CONVERSION_ID/CONVERSION_LABEL',
                                'value': 1.0,
                                'currency': 'EUR'
                            });
                        }
                        
                        // Scroll to success message
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        throw new Error('Form submission failed');
                    }
                } catch (error) {
                    button.textContent = 'Probeer opnieuw';
                    button.disabled = false;
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 3000);
                }
            });
        }
    </script>
    
    <!-- Google Analytics -->
    <!-- Vervang G-XXXXXXXXXX met je eigen Google Analytics ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
</body>
</html>
