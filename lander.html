<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitty - Verhoog je omzet met 50%</title>
    <meta name="description" content="Laat je klanten betalen zoals zij willen. Verhoog conversie met flexibele betaalopties.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0E100F 0%, #1a1c1b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: white;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }
        
        .accent {
            background: linear-gradient(135deg, #43DB6F 0%, #00FF66 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }
        
        .form {
            max-width: 400px;
            margin: 0 auto 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .input {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .input:focus {
            outline: none;
            border-color: #43DB6F;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(67, 219, 111, 0.1);
        }
        
        .button {
            padding: 1.25rem 2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #43DB6F 0%, #00FF66 100%);
            color: #0E100F;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(67, 219, 111, 0.3);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(67, 219, 111, 0.4);
        }
        
        .features {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 120px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .description {
                font-size: 1.1rem;
            }
            
            .features {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <img src="https://cdn.prod.website-files.com/680a69113e179ecd02a69613/680be744050df4a2fa729a9d_Logo.svg" 
         alt="Splitty Logo" 
         class="logo">
    
    <div class="container">
        <h1>Verhoog je omzet met <span class="accent">50%</span></h1>
        <p class="description">
            Bied je klanten de vrijheid om te betalen zoals zij willen. 
            Split betalingen, betaal later, of direct - alles in één oplossing.
        </p>
        
        <form class="form" action="https://formspree.io/f/mjkrvran" method="POST">
            <input type="text" name="name" placeholder="Naam" class="input" required>
            <input type="email" name="email" placeholder="Email" class="input" required>
            <input type="tel" name="phone" placeholder="Telefoonnummer" class="input" required>
            <input type="text" name="company" placeholder="Bedrijfsnaam" class="input">
            <input type="hidden" name="_subject" value="Nieuwe lead van landing page">
            <input type="hidden" name="_next" value="https://splitty.nl/bedankt">
            <button type="submit" class="button">Start Gratis Trial</button>
        </form>
        
        <div class="features">
            <div class="feature">✓ Geen setupkosten</div>
            <div class="feature">✓ Binnen 5 minuten live</div>
            <div class="feature">✓ 30 dagen gratis proberen</div>
        </div>
    </div>
    
    <!-- Google Analytics of andere tracking hier -->
    <script>
        // Track form submissions
        document.querySelector('.form').addEventListener('submit', function() {
            console.log('Form submitted');
            // Voeg hier je tracking code toe
        });
    </script>
</body>
</html>
